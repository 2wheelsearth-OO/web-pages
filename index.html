<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Velocipede</title>
    <style>
        body { margin: 0; background: #000; color: #fff; font-family: sans-serif; }
        .phone-frame { width: 100%; max-width: 414px; margin: auto; padding: 20px; box-sizing: border-box; }
        
        /* Your existing top corners */
        .header { display: flex; justify-content: space-between; font-size: 10px; color: #888; margin-bottom: 20px; }
        
        /* Title */
        .title { font-weight: bold; text-align: center; margin-bottom: 20px; }
        
        /* Bike Display */
        .bike-container { position: relative; width: 100%; height: 200px; margin-bottom: 20px; }
        .bike-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-size: contain; background-position: center; background-repeat: no-repeat; }
        #top-tube { transition: transform 0.5s ease; transform-origin: 25% 40%; }
        
        /* UI Rows */
        .row { margin-bottom: 20px; }
        .row-label { display: flex; justify-content: space-between; margin-bottom: 5px; }
        .btn-group { display: flex; gap: 5px; margin-bottom: 15px; }
        button { flex: 1; padding: 10px; background: #333; color: #fff; border: 1px solid #444; cursor: pointer; }
        button.active { background: #007bff; border-color: #007bff; }
        input { width: 100%; }
    </style>
</head>
<body>
    <div class="phone-frame">
        <div class="header"><span>v2026.06.08</span><span>USER_ID_001</span></div>
        <div class="title">Velocipede</div>
        
        <div class="bike-container">
            <div class="bike-layer" style="background-image: url('collagraphy bike frame white logo (1).png');"></div>
            <div id="top-tube" class="bike-layer" style="background-image: url('collagraphy bike top bar white logo (1).png');"></div>
        </div>

        <div class="row">
            <label>Frame Style</label>
            <div class="btn-group" id="btn-group">
                <button onclick="setS(this, 'M')" class="active">High-Bar</button>
                <button onclick="setS(this, 'X')">Mixed</button>
                <button onclick="setS(this, 'F')">Step-Thru</button>
            </div>
        </div>

        <div class="row">
            <div class="row-label">
                <label>Rider Height</label>
                <span id="h-val">36"</span>
            </div>
            <input type="range" min="36" max="82" value="36" oninput="document.getElementById('h-val').innerText = this.value + '\"'">
        </div>

        <div class="row">
            <div class="row-label">
                <label>Ideal Budget</label>
                <span id="b-val">$1000</span>
            </div>
            <input type="range" min="50" max="1000" value="1000" oninput="document.getElementById('b-val').innerText = '$' + this.value">
        </div>
    </div>

    <script>
        function setS(btn, style) {
            document.querySelectorAll('#btn-group button').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            const t = document.getElementById('top-tube');
            if (style === 'M') t.style.transform = "rotate(0deg)";
            else if (style === 'X') t.style.transform = "rotate(-30deg)";
            else if (style === 'F') t.style.transform = "rotate(-60deg)";
        }
    </script>
</body>
</html>
