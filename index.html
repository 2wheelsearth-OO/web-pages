<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Velocipede | Matchmaker</title>
    <link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=db03143b4d">

    <style>
    /* CORE MOBILE APP LAYOUT */
    body {
        background-color: #121212;
        color: #ffffff;
        margin: 0;
        padding: 0;
        overflow: hidden;
        height: 100vh;
        display: flex;
        justify-content: center;
    }

    .app-container {
        width: 100%;
        max-width: 414px;
        height: 100vh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
    }

    /* SPLASH SECTION - CENTERED AS A UNIT */
    #splash-screen-group {
        flex: 1;
        display: flex !important;
        flex-direction: column !important;
        align-items: center !important;
        justify-content: center !important; /* Forces logo/text to center of remaining space */
        padding-top: 10px;
    }

    .backdrop-container {
        width: 80%;
        height: 140px;
    }

    .animated-bike {
        width: 100%;
        height: 100%;                
        background-image: url('https://raw.githubusercontent.com/2wheelsearth-OO/Assets/main/collagraphy%20bike%20white%20logo.png');
        background-size: contain;     
        background-position: center; 
        background-repeat: no-repeat;
    }

    .header-wrap {
        text-align: center;
        margin-top: 10px;
        padding: 0 20px;
    }

    .header-wrap h1 {
        margin: 0;
        font-size: 1.4rem;
        font-family: 'Permanent Marker', cursive;
        white-space: nowrap;
    }

    /* UI SECTION - PINNED TO BOTTOM */
    .ui {
        flex: 0 0 auto;
        padding: 10px 20px 20px 20px;
        background: #121212;
    }

    body.hide-splash #splash-screen-group { display: none !important; }
    .corner { position: fixed; bottom: 5px; left: 5px; font-size: 9px; color: #444; }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="corner">2026-06-08-version 19</div>

        <div id="splash-screen-group">
            <div class="backdrop-container">
                <div class="animated-bike"></div>
            </div>
            <div class="header-wrap">
                <h1>Stop Walking. Start Rolling.</h1>
            </div>
        </div>

        <div class="ui">
            <div class="group">
                <span class="type-label">Frame Style</span>
                <div class="row">
                    <button class="btn" id="b-M" onclick="setS('M')">High-Bar</button>
                    <button class="btn active" id="b-any" onclick="setS('any')">Mixed</button>
                    <button class="btn" id="b-F" onclick="setS('F')">Step-Thru</button>
                </div>
            </div>

            <div class="group">
                <div class="sld-header">
                    <span class="sld-title">Rider Height</span>
                    <span id="hL" class="sld-value">3'0" (91cm)</span>
                </div>
                <input type="range" id="hS" min="36" max="82" value="36" oninput="runUpdate()">
            </div>

            <div class="group">
                <div class="sld-header">
                    <span class="sld-title">Ideal Budget</span>
                    <span id="bL" class="sld-value">$50</span>
                </div>
                <input type="range" id="bS" min="50" max="1000" value="50" oninput="runUpdate()">
                <div id="matchRange" class="match-msg">Matching Catalog...</div>
            </div>
        </div>

        <div class="gallery-container">
            <div id="loading-status">Connecting to Inventory...</div>
            <div class="gallery" id="bike-gallery"></div>
        </div>
    </div>

    <script src="index.js"></script>
    <script>
        const heightSlider = document.getElementById('hS');
        const checkSplash = () => {
            if(heightSlider.value > 36) document.body.classList.add('hide-splash');
            else document.body.classList.remove('hide-splash');
        };
        heightSlider.addEventListener('input', checkSplash);
    </script>
</body>
</html>
