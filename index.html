<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Velocipede | Matchmaker</title>
    <link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=db03143b4d">

    <style>
    /* Critical corner positioning - kept inline to guarantee it overrides any cached stylesheet */
    .corner{position:fixed;font-size:12px;color:var(--dim,#9aa0a6);font-weight:600;z-index:100;padding:10px}
    .corner.tl{top:10px;left:10px}
    .corner.tr{top:10px;right:10px}
    .corner.bl{bottom:10px;left:10px}
    .corner.br{bottom:10px;right:10px}

    /* CLEAN WHITE PAPER & ENTIRE BIKE BACKDROP */
    .backdrop-container {
        width: 100%;
        height: 45vh;                 /* Takes up proportional vertical space */
        min-height: 250px;
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
        background-image: url('https://raw.githubusercontent.com/2wheelsearth-OO/Assets/main/collagraphy%20bike%20logo.png');
        background-size: contain;      /* Forces the ENTIRE bike illustration to fit without clipping */
        background-position: center;   /* Centers the image perfectly */
        background-repeat: no-repeat;  /* Prevents tiling */
        background-color: #f7f7f4;     /* Crisp white-paper texture tint companion */
        border-radius: 8px;
        margin: 10px 0;
        /* No color inversion filter here: displays natural dark ink on white paper */
    }
    </style>
</head>
<body>

    <div class="corner tl" id="d">DATE</div>
    <div class="corner tr" id="t">TIME</div>
    <div class="corner bl">V66.15.0</div>
    <div class="corner br" id="s">RES</div>

    <div class="header-wrap">
        <h1>Stop Walking. Start Rolling.</h1>
        <p class="sub">Local Inventory Matchmaker</p>
    </div>

    <div class="backdrop-container"></div>

    <div class="ui">
        <div class="group">
            <span class="type-label">Frame Style</span>
            <div class="row">
                <button class="btn" id="b-M" onclick="setS('M')">High-Bar</button>
                <button class="btn active" id="b-any" onclick="setS('any')">Mixed</button>
                <button class="btn" id="b-F" onclick="setS('F')">Step-Thru</button>
            </div>
        </div>

        <div class="group">
            <div class="sld-header">
                <span class="sld-title">Rider Height</span>
                <span id="hL" class="sld-value">3'0" (91cm)</span>
            </div>
            <div class="sld-input-container">
                <input type="range" id="hS" min="36" max="82" value="36" oninput="runUpdate()">
            </div>
        </div>

        <div class="group">
            <div class="sld-header">
                <span class="sld-title">Ideal Budget</span>
                <span id="bL" class="sld-value">$30</span>
            </div>
            <div class="sld-input-container">
                <input type="range" id="bS" min="0" max="100" value="30" oninput="runUpdate()">
            </div>
            <div class="match-feedback-row">
                <div id="matchRange" class="match-msg">Matching Catalog...</div>
            </div>
        </div>
    </div>

    <div class="gallery-container">
        <div id="loading-status">Connecting to Inventory...</div>
        <div class="gallery" id="bike-gallery"></div>
    </div>

    <script src="index.js"></script>
    
    <script>
        /**
         * Safe initialization: Prevents "ReferenceError: init is not defined"
         * by waiting for the DOM to be ready and ensuring index.js is available.
         */
        document.addEventListener('DOMContentLoaded', () => {
            const checkAndInit = () => {
                if (typeof init === 'function') {
                    init();
                } else {
                    // Try again in 50ms if script isn't ready
                    setTimeout(checkAndInit, 50);
                }
            };
            checkAndInit();
        });
    </script>
</body>
</html>
