<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Velocipede | Matchmaker</title>
    <link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&display=swap" rel="stylesheet">
    <style>
        /* 1. RESET BODY: Centers the phone-frame on any screen */
        body {
            background-color: #000; /* Dark outside the phone area */
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* 2. THE PHONE SCREEN BOUNDARY */
        .phone-frame {
            width: 100%;
            max-width: 414px; /* Exact iPhone-style width */
            height: 100%;
            max-height: 896px; /* Exact iPhone-style height */
            background-color: #121212;
            display: flex;
            flex-direction: column;
            border: 2px solid #333;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            position: relative;
        }

        /* 3. SPLASH: Stays at the top */
        #splash-screen-group {
            flex: 0 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 40px;
        }

        .backdrop-container {
            width: 80%;
            height: 120px;
            background-image: url('https://raw.githubusercontent.com/2wheelsearth-OO/Assets/main/collagraphy%20bike%20white%20logo.png');
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
        }

        .header-wrap {
            margin-top: 10px;
            text-align: center;
        }

        .header-wrap h1 {
            color: #fff;
            margin: 0;
            font-size: 1.2rem;
            font-family: 'Permanent Marker', cursive;
            white-space: nowrap;
        }

        /* 4. UI: Fills the remaining space at the bottom */
        .ui {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 20px;
            gap: 15px;
        }

        /* 5. DYNAMIC HIDE */
        body.hide-splash #splash-screen-group { display: none !important; }
        .corner { position: absolute; bottom: 5px; left: 5px; font-size: 8px; color: #444; }
    </style>
</head>
<body>

    <div class="phone-frame">
        <div class="corner">2026-06-08-version 22</div>

        <div id="splash-screen-group">
            <div class="backdrop-container"></div>
            <div class="header-wrap">
                <h1>Stop Walking. Start Rolling.</h1>
            </div>
        </div>

        <div class="ui">
            <div class="group">
                <span style="color:#aaa; font-size: 0.8rem;">Frame Style</span>
                <div class="row" style="margin-top: 5px;">
                    <button class="btn">High-Bar</button>
                    <button class="btn active">Mixed</button>
                    <button class="btn">Step-Thru</button>
                </div>
            </div>
            <div class="group">
                <span style="color:#aaa; font-size: 0.8rem;">Rider Height</span>
                <input type="range" id="hS" min="36" max="82" style="width:100%;">
            </div>
            <div class="group" style="padding-bottom: 20px;">
                <span style="color:#aaa; font-size: 0.8rem;">Ideal Budget</span>
                <input type="range" id="bS" min="50" max="1000" style="width:100%;">
            </div>
        </div>
    </div>

    <script>
        const heightSlider = document.getElementById('hS');
        heightSlider.addEventListener('input', () => {
            if(heightSlider.value > 36) document.body.classList.add('hide-splash');
            else document.body.classList.remove('hide-splash');
        });
    </script>
</body>
</html>
