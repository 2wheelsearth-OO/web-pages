<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Velocipede</title>
    </head>
<body>

    <div class="header-wrap">
        <h1>Velocipede</h1>
        <div class="sub">Stop Walking. Start Rolling.</div>
    </div>

    <div id="bike-viewer" class="bike-hero">
        <div id="frame-layer" class="layer"></div>
        <div id="topbar-layer" class="layer"></div>
    </div>

    <div class="gallery-container">
        <div id="bike-gallery" class="gallery"></div>
    </div>

    <div class="ui">
        <div class="group">
            <div class="row">
                <button class="btn" id="btn-highbar">High-Bar</button>
                <button class="btn" id="btn-reset">Frame Only</button>
            </div>
        </div>
        <input type="range" id="hS" min="36" max="82" value="60">
        <input type="range" id="bS" min="50" max="1000" value="500">
        <input type="range" id="rotS" min="0" max="360" value="0">
    </div>

    <script src="index.js"></script>
    <script>
        // Overlay logic
        const topBar = document.getElementById('topbar-layer');
        document.getElementById('btn-highbar').addEventListener('click', () => {
            topBar.style.display = 'block';
        });
        document.getElementById('btn-reset').addEventListener('click', () => {
            topBar.style.display = 'none';
        });
    </script>
</body>
</html>
