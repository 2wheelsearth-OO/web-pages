<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Velocipede</title>
    <style>
        body { margin: 0; background-color: #000; color: #fff; font-family: sans-serif; }
        
        /* THE BIKE LAYER CONTAINER */
        .bike-display { position: relative; width: 100%; height: 250px; margin-bottom: 20px; }
        .bike-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-size: contain; background-position: center; background-repeat: no-repeat; }
        #top-tube { transition: transform 0.5s ease; transform-origin: 25% 40%; }

        /* ALL YOUR ORIGINAL UI STYLES REMAIN UNTOUCHED */
        .ui-container { padding: 20px; }
        button { cursor: pointer; padding: 10px; margin: 5px; }
        input { width: 100%; margin-bottom: 20px; }
    </style>
</head>
<body>

    <div class="ui-container">
        <div class="bike-display">
            <div class="bike-layer" style="background-image: url('collagraphy bike frame white logo (1).png');"></div>
            <div id="top-tube" class="bike-layer" style="background-image: url('collagraphy bike top bar white logo (1).png');"></div>
        </div>

        <button onclick="rotateTube('high')">High-Bar</button>
        <button onclick="rotateTube('mix')">Mixed</button>
        <button onclick="rotateTube('step')">Step-Thru</button>
        
        <label>Rider Height</label>
        <input type="range">
        
        <label>Ideal Budget</label>
        <input type="range">
    </div>

    <script>
        function rotateTube(type) {
            const tube = document.getElementById('top-tube');
            if (type === 'high') tube.style.transform = "rotate(0deg)";
            if (type === 'mix') tube.style.transform = "rotate(-30deg)";
            if (type === 'step') tube.style.transform = "rotate(-60deg) translateX(5px)";
        }
    </script>
</body>
</html>
