<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Velocipede | Matchmaker</title>
    <style>
        body { background-color: #000; margin: 0; display: flex; justify-content: center; height: 100vh; overflow: hidden; font-family: sans-serif; }
        
        .phone-frame { width: 100%; max-width: 414px; height: 100%; background-color: #121212; display: flex; flex-direction: column; position: relative; }
        
        .bike-display { position: relative; width: 100%; height: 200px; margin-top: 20px; }
        .bike-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-size: contain; background-position: center; background-repeat: no-repeat; }
        #top-tube { transition: transform 0.5s ease-in-out; transform-origin: 25% 40%; }
        
        .ui { flex: 1; display: flex; flex-direction: column; padding: 20px; gap: 15px; }
        
        /* Highlight Logic */
        button { cursor: pointer; padding: 10px; background: #333; color: white; border: none; border-radius: 4px; }
        button.active { background-color: #007bff; } /* Same blue as browser default slider */
        
        .corner { position: absolute; bottom: 5px; left: 5px; font-size: 8px; color: #444; }
    </style>
</head>
<body>
    <div class="phone-frame">
        <div class="corner">2026-06-08-version 23</div>
        
        <div class="bike-display">
            <div class="bike-layer" style="background-image: url('collagraphy bike frame white logo (1).png');"></div>
            <div id="top-tube" class="bike-layer" style="background-image: url('collagraphy bike top bar white logo (1).png');"></div>
        </div>

        <div class="ui">
            <div class="group">
                <span>Frame Style</span>
                <div class="row" id="btn-group">
                    <button onclick="setS(this, 'M')">High-Bar</button>
                    <button onclick="setS(this, 'X')">Mixed</button>
                    <button onclick="setS(this, 'F')">Step-Thru</button>
                </div>
            </div>
            <div class="group">
                <span>Rider Height</span>
                <input type="range" id="hS" min="36" max="82" style="width:100%;">
            </div>
            <div class="group">
                <span>Ideal Budget</span>
                <input type="range" id="bS" min="50" max="1000" style="width:100%;">
            </div>
        </div>
    </div>

    <script>
        function setS(btn, style) {
            // 1. Handle Button Highlighting
            document.querySelectorAll('#btn-group button').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            // 2. Handle Bike Rotation
            const topTube = document.getElementById('top-tube');
            if (style === 'M') topTube.style.transform = "rotate(0deg)";
            else if (style === 'F') topTube.style.transform = "rotate(-60deg)";
            else topTube.style.transform = "rotate(-30deg)";
        }
    </script>
</body>
</html>
