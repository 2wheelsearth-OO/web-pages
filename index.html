<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Velocipede</title>
    <link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&display=swap" rel="stylesheet">
    <style>
        body { background-color: #000; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; color: #fff; font-family: sans-serif; }
        .phone-frame { width: 100%; max-width: 414px; height: 100%; max-height: 896px; background-color: #121212; display: flex; flex-direction: column; position: relative; }
        
        /* Bike Viewer Area */
        #bike-viewer { flex: 2; display: flex; justify-content: center; align-items: center; position: relative; }
        #bike-frame { width: 200px; height: 200px; background-image: url('https://raw.githubusercontent.com/2wheelsearth-OO/Assets/main/collagraphy%20bike%20white%20logo.png'); background-size: contain; background-repeat: no-repeat; transition: transform 0.1s ease-out; }

        /* UI Area */
        .ui { flex: 1; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .group { display: flex; flex-direction: column; }
        
        #splash-screen-group { position: absolute; top: 40px; width: 100%; display: flex; flex-direction: column; align-items: center; z-index: 10; background: #121212; height: 100%; }
        body.hide-splash #splash-screen-group { display: none; }
    </style>
</head>
<body>

    <div class="phone-frame">
        <div id="splash-screen-group">
            <div style="width: 80%; height: 120px; background: url('https://raw.githubusercontent.com/2wheelsearth-OO/Assets/main/collagraphy%20bike%20white%20logo.png') center/contain no-repeat;"></div>
            <h1>Stop Walking. Start Rolling.</h1>
        </div>

        <div id="bike-viewer">
            <div id="bike-frame"></div>
        </div>

        <div class="ui">
            <div class="group">
                <label>Rider Height</label>
                <input type="range" id="hS" min="36" max="82" value="36">
            </div>
            <div class="group">
                <label>Rotation Control</label>
                <input type="range" id="rS" min="0" max="360" value="0">
            </div>
        </div>
    </div>

    <script>
        const heightSlider = document.getElementById('hS');
        const rotationSlider = document.getElementById('rS');
        const bike = document.getElementById('bike-frame');

        // Logic for hiding the splash screen
        heightSlider.addEventListener('input', (e) => {
            if(parseInt(e.target.value) > 36) {
                document.body.classList.add('hide-splash');
            } else {
                document.body.classList.remove('hide-splash');
            }
        });

        // Logic for rotating the bike
        rotationSlider.addEventListener('input', (e) => {
            bike.style.transform = `rotate(${e.target.value}deg)`;
        });
    </script>
</body>
</html>
