<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Velocipede | Matchmaker</title>
    <style>
        /* Base styling to ensure everything fits the screen */
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background-color: #000; color: #fff; font-family: sans-serif; overflow: hidden; }
        
        .phone-frame { width: 100%; max-width: 414px; height: 100%; margin: auto; background-color: #121212; position: relative; display: flex; flex-direction: column; padding: 20px; box-sizing: border-box; }
        
        /* Bike Display Area */
        .bike-display { position: relative; width: 100%; height: 200px; flex-shrink: 0; }
        .bike-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-size: contain; background-position: center; background-repeat: no-repeat; }
        #top-tube { transition: transform 0.5s ease-in-out; transform-origin: 25% 40%; }
        
        /* Controls and Text */
        .ui { flex: 1; display: flex; flex-direction: column; gap: 20px; }
        .group { display: flex; flex-direction: column; }
        label { font-size: 14px; margin-bottom: 5px; }
        .value-display { font-size: 14px; color: #aaa; margin-bottom: 5px; }
        
        /* Buttons */
        .row { display: flex; gap: 10px; }
        button { cursor: pointer; padding: 10px; background: #333; color: white; border: none; border-radius: 4px; font-size: 14px; }
        button.active { background-color: #007bff; }
        
        /* 4-Corner Information */
        .corner { position: absolute; font-size: 12px; color: #fff; padding: 10px; }
        .top-left { top: 0; left: 0; }
        .top-right { top: 0; right: 0; }
        .bottom-left { bottom: 0; left: 0; }
        .bottom-right { bottom: 0; right: 0; }
    </style>
</head>
<body>
    <div class="phone-frame">
        <div class="corner top-left">Info TL</div>
        <div class="corner top-right">Info TR</div>
        <div class="corner bottom-left">2026-06-08-version 23</div>
        <div class="corner bottom-right">Info BR</div>
        
        <div class="bike-display">
            <div class="bike-layer" style="background-image: url('collagraphy bike frame white logo (1).png');"></div>
            <div id="top-tube" class="bike-layer" style="background-image: url('collagraphy bike top bar white logo (1).png');"></div>
        </div>

        <div class="ui">
            <div class="group">
                <label>Frame Style</label>
                <div class="row" id="btn-group">
                    <button onclick="setS(this, 'M')" class="active">High-Bar</button>
                    <button onclick="setS(this, 'X')">Mixed</button>
                    <button onclick="setS(this, 'F')">Step-Thru</button>
                </div>
            </div>
            <div class="group">
                <label>Rider Height</label>
                <div class="value-display" id="h-val">36"</div>
                <input type="range" id="hS" min="36" max="82" value="36" style="width:100%;" oninput="updateVal('h-val', this.value, '\"')">
            </div>
            <div class="group">
                <label>Ideal Budget</label>
                <div class="value-display" id="b-val">$50</div>
                <input type="range" id="bS" min="50" max="1000" value="50" style="width:100%;" oninput="updateVal('b-val', this.value, '$')">
            </div>
        </div>
    </div>

    <script>
        function setS(btn, style) {
            document.querySelectorAll('#btn-group button').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            const topTube = document.getElementById('top-tube');
            if (style === 'M') topTube.style.transform = "rotate(0deg)";
            else if (style === 'F') topTube.style.transform = "rotate(-60deg)";
            else topTube.style.transform = "rotate(-30deg)";
        }
        function updateVal(id, val, prefix) {
            document.getElementById(id).innerText = (prefix === '$' ? '$' : '') + val + (prefix === '\"' ? '\"' : '');
        }
    </script>
</body>
</html>
