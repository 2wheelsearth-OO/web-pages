<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Velocipede</title>
    <style>
        body { margin: 0; background: #000; color: #fff; font-family: sans-serif; display: flex; justify-content: center; height: 100vh; overflow: hidden; }
        .phone-frame { width: 100%; max-width: 414px; height: 100%; background: #121212; position: relative; padding: 20px; box-sizing: border-box; display: flex; flex-direction: column; }
        
        /* 4-Corner Information */
        .corner { position: absolute; font-size: 12px; color: #fff; padding: 10px; }
        .tl { top: 0; left: 0; } .tr { top: 0; right: 0; }
        .bl { bottom: 0; left: 0; } .br { bottom: 0; right: 0; }
        
        /* Bike Display */
        .bike-display { position: relative; width: 100%; height: 200px; margin-top: 30px; margin-bottom: 20px; }
        .bike-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-size: contain; background-position: center; background-repeat: no-repeat; }
        #top-tube { transition: transform 0.5s ease; transform-origin: 25% 40%; }
        
        /* UI Elements */
        .group { margin-bottom: 20px; }
        .row-label { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 5px; }
        .row-btns { display: flex; gap: 5px; margin-bottom: 10px; }
        button { cursor: pointer; padding: 8px 12px; background: #333; color: white; border: none; border-radius: 4px; font-size: 12px; flex: 1; }
        button.active { background-color: #007bff; }
        input { width: 100%; }
    </style>
</head>
<body>
    <div class="phone-frame">
        <div class="corner tl">TL Info</div>
        <div class="corner tr">TR Info</div>
        <div class="corner bl">2026-06-08-v23</div>
        <div class="corner br">BR Info</div>
        
        <div class="bike-display">
            <div class="bike-layer" style="background-image: url('collagraphy bike frame white logo (1).png');"></div>
            <div id="top-tube" class="bike-layer" style="background-image: url('collagraphy bike top bar white logo (1).png');"></div>
        </div>

        <div class="ui">
            <label style="font-size: 14px;">Frame Style</label>
            <div class="row-btns" id="btn-group">
                <button onclick="setS(this, 'M')" class="active">High-Bar</button>
                <button onclick="setS(this, 'X')">Mixed</button>
                <button onclick="setS(this, 'F')">Step-Thru</button>
            </div>
            
            <div class="group">
                <div class="row-label">
                    <label>Rider Height</label>
                    <span id="h-val">36"</span>
                </div>
                <input type="range" min="36" max="82" value="36" oninput="updateVal('h-val', this.value, '\"')">
            </div>
            
            <div class="group">
                <div class="row-label">
                    <label>Ideal Budget</label>
                    <span id="b-val">$50</span>
                </div>
                <input type="range" min="50" max="1000" value="50" oninput="updateVal('b-val', this.value, '$')">
            </div>
        </div>
    </div>

    <script>
        function setS(btn, style) {
            document.querySelectorAll('#btn-group button').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            const t = document.getElementById('top-tube');
            if (style === 'M') t.style.transform = "rotate(0deg)";
            else if (style === 'X') t.style.transform = "rotate(-30deg)";
            else if (style === 'F') t.style.transform = "rotate(-60deg)";
        }
        function updateVal(id, v, p) { document.getElementById(id).innerText = (p === '$' ? '$' : '') + v + (p === '\"' ? '\"' : ''); }
    </script>
</body>
</html>
