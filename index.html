<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Velocipede | Matchmaker</title>
    <link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=db03143b4d">

    <style>
    /* Absolute corner safety overrides to keep text elements anchored inside the screen view */
    .corner {
        position: fixed !important;
        font-size: 12px !important;
        color: var(--dim, #9aa0a6) !important;
        font-weight: 600 !important;
        z-index: 9999 !important;
        padding: 10px !important;
        background: transparent !important;
    }
    .corner.tl { top: 10px !important; left: 10px !important; }
    .corner.tr { top: 10px !important; right: 10px !important; }
    .corner.bl { bottom: 10px !important; left: 10px !important; display: block !important; }
    .corner.br { bottom: 10px !important; right: 10px !important; }

    /* ALL DARK THEME BACKGROUND & NO RIGHT SLIDER BAR */
    body {
        background-color: #121212;
        color: #ffffff;
        margin: 0;
        padding: 0;
        overflow-x: hidden;
        scrollbar-width: none; 
        -ms-overflow-style: none;  
    }
    
    body::-webkit-scrollbar {
        display: none;
    }

    /* SPLASH VERTICAL LAYOUT CONFIGURATION */
    #splash-screen-group {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 100%;
        margin-top: 20px;
    }

    /* MIDSECTION GRAPHIC CONTAINER FRAME */
    .backdrop-container {
        width: 100%;
        max-width: 500px;
        height: 220px;                 
        position: relative;
        background-color: transparent; 
        display: flex;                
        justify-content: center;      
        align-items: center;          
    }

    /* SCALED UP STATIC WHITE TRANSPARENT BIKE */
    .animated-bike {
        width: 100%;
        height: 100%;                
        background-image: url('https://raw.githubusercontent.com/2wheelsearth-OO/Assets/main/collagraphy%20bike%20white%20logo.png');
        background-size: contain;     
        background-position: center center; 
        background-repeat: no-repeat;
        opacity: 0.85;                
    }

    /* TEXT WRAPPER POSITIONED STRUCTURALLY BELOW BICYCLE LOGO FRAME */
    .header-wrap {
        text-align: center;
        margin: 15px 0 25px 0;
        padding: 0 15px;
        width: 100%;
    }

    .header-wrap h1 {
        margin: 0;
        font-size: 2.2rem;
        line-height: 1.2;
        font-family: 'Permanent Marker', cursive, sans-serif;
    }

    /* MASTER SWITCH RULE */
    body.hide-splash #splash-screen-group {
        display: none !important;
    }
    </style>
</head>
<body>

    <div class="corner tl" id="d">DATE</div>
    <div class="corner tr" id="t">TIME</div>
    <div class="corner bl" style="display: block !important;">672026-5</div>
    <div class="corner br" id="s">RES</div>

    <div id="splash-screen-group">
        <div class="backdrop-container">
            <div class="animated-bike"></div>
        </div>
        <div class="header-wrap">
            <h1>Stop Walking. Start Rolling.</h1>
        </div>
    </div>

    <div class="ui">
        <div class="group">
            <span class="type-label">Frame Style</span>
            <div class="row">
                <button class="btn" id="b-M" onclick="setS('M')">High-Bar</button>
                <button class="btn active" id="b-any" onclick="setS('any')">Mixed</button>
                <button class="btn" id="b-F" onclick="setS('F')">Step-Thru</button>
            </div>
        </div>

        <div class="group">
            <div class="sld-header">
                <span class="sld-title">Rider Height</span>
                <span id="hL" class="sld-value">3'0" (91cm)</span>
            </div>
            <div class="sld-input-container">
                <input type="range" id="hS" min="36" max="82" value="36" oninput="runUpdate()">
            </div>
        </div>

        <div class="group">
            <div class="sld-header">
                <span class="sld-title">Ideal Budget</span>
                <span id="bL" class="sld-value">$50</span>
            </div>
            <div class="sld-input-container">
                <input type="range" id="bS" min="50" max="1000" value="50" oninput="runUpdate()">
            </div>
            <div class="match-feedback-row">
                <div id="matchRange" class="match-msg">Matching Catalog...</div>
            </div>
        </div>
    </div>

    <div class="gallery-container">
        <div id="loading-status">Connecting to Inventory...</div>
        <div class="gallery" id="bike-gallery"></div>
    </div>

    <script src="index.js"></script>
    
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const checkAndInit = () => {
                if (typeof init === 'function') {
                    init();
                } else {
                    setTimeout(checkAndInit, 50);
                }
            };
            checkAndInit();

            // Direct tracking layer based on slider movement interaction states
            const heightSlider = document.getElementById('hS');
            
            const evaluateSplashVisibility = () => {
                if (heightSlider) {
                    if (parseInt(heightSlider.value) > 36) {
                        document.body.classList.add('hide-splash');
                    } else {
                        document.body.classList.remove('hide-splash');
                    }
                }
            };

            evaluateSplashVisibility();

            if (heightSlider) {
                heightSlider.addEventListener('input', evaluateSplashVisibility);
                heightSlider.addEventListener('change', evaluateSplashVisibility);
            }
        });
    </script>
</body>
</html>
