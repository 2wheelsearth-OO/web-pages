<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Velocipede | Matchmaker</title>
    <link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=db03143b4d">

    <style>
    /* ALL DARK THEME BACKGROUND & DESKTOP RESET */
    body {
        background-color: #000000; /* Deep black outer background for desktop framing */
        color: #ffffff;
        margin: 0;
        padding: 0;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        width: 100vw;
    }

    /* IPHONE 11 HARDWARE SIMULATION WRAPPER CONTAINER */
    .iphone-11-viewport {
        width: 375px;
        height: 812px;
        background-color: #121212; /* Original app dark background */
        position: relative;
        overflow-y: auto;
        overflow-x: hidden;
        box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
        border: 4px solid #222222; /* Clean edge frame bezel */
        border-radius: 20px;
        box-sizing: border-box;
        scrollbar-width: none; 
        -ms-overflow-style: none;  
    }
    
    .iphone-11-viewport::-webkit-scrollbar {
        display: none;
    }

    /* Absolute corner safety overrides bounded cleanly inside the iPhone container frame */
    .corner {
        position: absolute !important;
        font-size: 11px !important;
        color: var(--dim, #9aa0a6) !important;
        font-weight: 600 !important;
        z-index: 9999 !important;
        padding: 12px !important;
        background: transparent !important;
    }
    .corner.tl { top: 0 !important; left: 0 !important; }
    .corner.tr { top: 0 !important; right: 0 !important; }
    .corner.bl { bottom: 0 !important; left: 0 !important; display: block !important; }
    .corner.br { bottom: 0 !important; right: 0 !important; }

    /* SPLASH CONTAINER */
    #splash-screen-group {
        display: flex !important;
        flex-direction: column !important;
        align-items: center !important;
        width: 100%;
        margin-top: 35px;
    }

    /* MIDSECTION GRAPHIC CONTAINER FRAME */
    .backdrop-container {
        width: 100%;
        height: 180px;                 
        position: relative;
        background-color: transparent; 
    }

    /* SCALED UP STATIC WHITE TRANSPARENT BIKE */
    .animated-bike {
        width: 100%;
        height: 100%;                
        background-image: url('https://raw.githubusercontent.com/2wheelsearth-OO/Assets/main/collagraphy%20bike%20white%20logo.png');
        background-size: contain;     
        background-position: center center; 
        background-repeat: no-repeat;
        opacity: 0.85;                
    }

    /* POSITIONED NATURALLY FLUSH BELOW WHEELS */
    .header-wrap {
        display: block !important;
        position: relative !important;
        text-align: center !important;
        margin-top: 5px !important;
        margin-bottom: 20px !important;
        padding: 0 15px;
        width: 100%;
        box-sizing: border-box;
    }

    .header-wrap h1 {
        margin: 0 !important;
        padding: 0 !important;
        font-size: 1.8rem !important; /* Resized slightly to sit flawlessly inside a 375px frame */
        line-height: 1.2 !important;
        font-family: 'Permanent Marker', cursive, sans-serif !important;
    }

    /* MASTER SWITCH RULE */
    body.hide-splash #splash-screen-group {
        display: none !important;
    }
    </style>
</head>
<body>

    <div class="iphone-11-viewport">

        <div class="corner tl" id="d">DATE</div>
        <div class="corner tr" id="t">TIME</div>
        <div class="corner bl" style="display: block !important;">2026-06-08-version 15</div>
        <div class="corner br" id="s">RES</div>

        <div id="splash-screen-group">
            <div class="backdrop-container">
                <div class="animated-bike"></div>
            </div>
            <div class="header-wrap">
                <h1>Stop Walking. Start Rolling.</h1>
            </div>
        </div>

        <div class="ui">
            <div class="group">
                <span class="type-label">Frame Style</span>
                <div class="row">
                    <button class="btn" id="b-M" onclick="setS('M')">High-Bar</button>
                    <button class="btn active" id="b-any" onclick="setS('any')">Mixed</button>
                    <button class="btn" id="b-F" onclick="setS('F')">Step-Thru</button>
                </div>
            </div>

            <div class="group">
                <div class="sld-header">
                    <span class="sld-title">Rider Height</span>
                    <span id="hL" class="sld-value">3'0" (91cm)</span>
                </div>
                <div class="sld-input-container">
                    <input type="range" id="hS" min="36" max="82" value="36" oninput="runUpdate()">
                </div>
            </div>

            <div class="group">
                <div class="sld-header">
                    <span class="sld-title">Ideal Budget</span>
                    <span id="bL" class="sld-value">$50</span>
                </div>
                <div class="sld-input-container">
                    <input type="range" id="bS" min="50" max="1000" value="50" oninput="runUpdate()">
                </div>
                <div class="match-feedback-row">
                    <div id="matchRange" class="match-msg">Matching Catalog...</div>
                </div>
            </div>
        </div>

        <div class="gallery-container">
            <div id="loading-status">Connecting to Inventory...</div>
            <div class="gallery" id="bike-gallery"></div>
        </div>

    </div>

    <script src="index.js"></script>
    
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const checkAndInit = () => {
                if (typeof init === 'function') {
                    init();
                } else {
                    setTimeout(checkAndInit, 50);
                }
            };
            checkAndInit();

            const heightSlider = document.getElementById('hS');
            
            const evaluateSplashVisibility = () => {
                if (heightSlider) {
                    if (parseInt(heightSlider.value) > 36) {
                        document.body.classList.add('hide-splash');
                    } else {
                        document.body.classList.remove('hide-splash');
                    }
                }
            };

            evaluateSplashVisibility();

            if (heightSlider) {
                heightSlider.addEventListener('input', evaluateSplashVisibility);
                heightSlider.addEventListener('change', evaluateSplashVisibility);
            }
        });
    </script>
</body>
</html>
