<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Velocipede | Matchmaker</title>
    <link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=db03143b4d">

    <style>
    /* Critical corner positioning - kept inline to guarantee it overrides any cached stylesheet */
    .corner{position:fixed;font-size:12px;color:var(--dim,#9aa0a6);font-weight:600;z-index:100;padding:10px}
    .corner.tl{top:10px;left:10px}
    .corner.tr{top:10px;right:10px}
    .corner.bl{bottom:10px;left:10px}
    .corner.br{bottom:10px;right:10px}

    /* ALL DARK THEME BACKGROUND & NO RIGHT SLIDER BAR */
    body {
        background-color: #121212;
        color: #ffffff;
        margin: 0;
        padding: 0;
        overflow-x: hidden;
        
        /* Hides the right side slider/scrollbar track across all modern browsers */
        scrollbar-width: none; /* Firefox */
        -ms-overflow-style: none;  /* IE and Edge */
    }
    
    /* Hide scrollbar for Chrome, Safari and Opera */
    body::-webkit-scrollbar {
        display: none;
    }

    /* MIDSECTION GRAPHIC CONTAINER FRAME - DYNAMIC HEIGHT */
    .backdrop-container {
        width: 100%;
        height: auto;                 /* Changed from fixed vh to auto to prevent overlap text bugs */
        padding-top: 40px;
        position: relative;
        background-color: transparent; 
        display: flex;                
        justify-content: center;      
        align-items: center;          
    }

    /* SCALED UP STATIC WHITE TRANSPARENT BIKE */
    .animated-bike {
        width: 90%;
        max-width: 500px;             /* Keeps the bike crisp and perfectly scaled */
        height: 250px;                /* Explicit clean bounding layout block */
        background-image: url('https://raw.githubusercontent.com/2wheelsearth-OO/Assets/main/collagraphy%20bike%20white%20logo.png');
        background-size: contain;     
        background-position: center center; 
        background-repeat: no-repeat;
        opacity: 0.85;                
    }

    /* TEXT WRAPPER POSITIONED NATURALLY BELOW */
    .header-wrap {
        text-align: center;
        margin: 10px 0 30px 0;
        padding: 0 15px;
    }

    .header-wrap h1 {
        margin: 0;
        font-size: 2.5rem;
        line-height: 1.2;
    }

    /* AUTOMATION RULES:
       When actual matching inventory blocks load inside the bike-gallery element, 
       this tells the browser to hide both the bike icon and the heading text layout blocks completely.
    */
    body:has(#bike-gallery > *) .backdrop-container,
    body:has(#bike-gallery > *) .header-wrap {
        display: none !important;
    }
    </style>
</head>
<body>

    <div class="corner tl" id="d">DATE</div>
    <div class="corner tr" id="t">TIME</div>
    <div class="corner bl">V66.15.0</div>
    <div class="corner br" id="s">RES</div>

    <div class="backdrop-container">
        <div class="animated-bike"></div>
    </div>

    <div class="header-wrap">
        <h1>Stop Walking. Start Rolling.</h1>
    </div>

    <div class="ui">
        <div class="group">
            <span class="type-label">Frame Style</span>
            <div class="row">
                <button class="btn" id="b-M" onclick="setS('M')">High-Bar</button>
                <button class="btn active" id="b-any" onclick="setS('any')">Mixed</button>
                <button class="btn" id="b-F" onclick="setS('F')">Step-Thru</button>
            </div>
        </div>

        <div class="group">
            <div class="sld-header">
                <span class="sld-title">Rider Height</span>
                <span id="hL" class="sld-value">3'0" (91cm)</span>
            </div>
            <div class="sld-input-container">
                <input type="range" id="hS" min="36" max="82" value="36" oninput="runUpdate()">
            </div>
        </div>

        <div class="group">
            <div class="sld-header">
                <span class="sld-title">Ideal Budget</span>
                <span id="bL" class="sld-value">$30</span>
            </div>
            <div class="sld-input-container">
                <input type="range" id="bS" min="0" max="100" value="30" oninput="runUpdate()">
            </div>
            <div class="match-feedback-row">
                <div id="matchRange" class="match-msg">Matching Catalog...</div>
            </div>
        </div>
    </div>

    <div class="gallery-container">
        <div id="loading-status">Connecting to Inventory...</div>
        <div class="gallery" id="bike-gallery"></div>
    </div>

    <script src="index.js"></script>
    
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const checkAndInit = () => {
                if (typeof init === 'function') {
                    init();
                } else {
                    setTimeout(checkAndInit, 50);
                }
            };
            checkAndInit();
        });
    </script>
</body>
</html>
